name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Byte-compile
        run: python -m compileall -q .

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  blender-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blender-version: ["5.1.0", "5.2.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender-${{ matrix.blender-version }}
          key: blender-linux-x64-${{ matrix.blender-version }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          major_minor="${{ matrix.blender-version }}"
          major_minor="${major_minor%.*}"
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/Blender${major_minor}/blender-${{ matrix.blender-version }}-linux-x64.tar.xz" \
            --output /tmp/blender.tar.xz
          mkdir -p "$HOME/blender-${{ matrix.blender-version }}"
          tar -xf /tmp/blender.tar.xz \
            --strip-components=1 \
            -C "$HOME/blender-${{ matrix.blender-version }}"

      - name: Validate and build extension package
        if: matrix.blender-version == '5.2.0'
        run: |
          "$HOME/blender-${{ matrix.blender-version }}/blender" \
            --command extension validate
          "$HOME/blender-${{ matrix.blender-version }}/blender" \
            --command extension build \
            --output-filepath /tmp/dicomator.zip

      - name: Prepare bundled dependency for source-tree smoke test
        run: |
          python -m pip install \
            --no-deps \
            --target /tmp/dicomator-python \
            wheels/pydicom-3.0.2-py3-none-any.whl

      - name: Register add-on in Blender
        run: |
          "$HOME/blender-${{ matrix.blender-version }}/blender" \
            --background \
            --factory-startup \
            --python-use-system-env \
            --python tests/blender_smoke.py
        env:
          PYTHONPATH: /tmp/dicomator-python
