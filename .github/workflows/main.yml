name: Zip DICOMator Add-on on Release

on:
  release:
    types: [published]   # runs when you click “Publish release”

permissions:
  contents: write        # needed to upload assets to the release

jobs:
  zip-and-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code at the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download Blender extension tools
        run: |
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz" \
            --output /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xf /tmp/blender.tar.xz --strip-components=1 -C /tmp/blender

      - name: Validate and build extension
        run: |
          /tmp/blender/blender --command extension validate
          /tmp/blender/blender --command extension build --output-filepath dicomator.zip

      - name: Upload dicomator.zip to this release
        uses: softprops/action-gh-release@v2
        with:
          files: dicomator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
